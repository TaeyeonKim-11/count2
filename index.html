<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Calculator</title>

<style>
* {
\box-sizing: border-box;
}

body {
\margin: 0;
\padding: 35px 15px;
\font-family: Arial, "Malgun Gothic", sans-serif;
\background: #f1f6fc;
\color: #334155;
}

.container {
\max-width: 850px;
\margin: auto;
\background: white;
\padding: 35px;
\border-radius: 20px;
\box-shadow: 0 8px 30px rgba(65, 105, 160, 0.09);
}

header {
\text-align: center;
\margin-bottom: 30px;
}

header h1 {
\color: #527eaf;
\font-size: 30px;
\margin-bottom: 8px;
\letter-spacing: 1px;
}

header p {
\color: #94a3b8;
\font-size: 14px;
}

.summary {
\display: grid;
\grid-template-columns: 1fr 1fr;
\gap: 15px;
\margin-bottom: 30px;
}

.summary-box {
\background: #edf5ff;
\padding: 20px;
\border-radius: 14px;
\text-align: center;
}

.summary-box span {
\display: block;
\font-size: 13px;
\color: #7895b7;
\margin-bottom: 10px;
}

.summary-box strong {
\font-size: 30px;
\color: #527eaf;
}

h2 {
\font-size: 18px;
\color: #527eaf;
\margin-bottom: 15px;
}

.course-list {
\display: flex;
\flex-direction: column;
\gap: 10px;
}

.course-row {
\display: grid;
\grid-template-columns: 2fr 1fr 1fr 45px;
\gap: 10px;
\align-items: center;
}

input, select {
\width: 100%;
\min-width: 0;
\padding: 12px;
\border: 1px solid #dbe5f0;
\border-radius: 9px;
\font-size: 14px;
\background: #fff;
\color: #334155;
}

input:focus, select:focus {
\outline: none;
\border-color: #80a9d5;
}

button {
\border: none;
\cursor: pointer;
\border-radius: 9px;
\font-size: 14px;
\transition: 0.2s;
}

.delete-btn {
\background: #fff0f0;
\color: #d66c6c;
\padding: 11px;
}

.delete-btn:hover {
\background: #ffe0e0;
}

.add-btn {
\width: 100%;
\padding: 13px;
\margin-top: 15px;
\background: #e8f2ff;
\color: #527eaf;
\font-weight: bold;
}

.add-btn:hover {
\background: #d8e9fc;
}

.reset-btn {
\width: 100%;
\margin-top: 25px;
\padding: 14px;
\background: #527eaf;
\color: white;
\font-weight: bold;
}

.reset-btn:hover {
\background: #3d6899;
}

.guide {
\margin-top: 25px;
\padding: 18px;
\background: #f7faff;
\border-radius: 12px;
\font-size: 13px;
\line-height: 1.9;
\color: #718096;
}

.message {
\color: #d66c6c;
\font-size: 13px;
\margin-top: 12px;
\min-height: 18px;
}

@media (max-width: 600px) {
.container {
\padding: 22px 16px;
}

\header h1 {
\font-size: 25px;
}

.course-row {
\grid-template-columns: 1.5fr 0.8fr 0.9fr 38px;
\gap: 5px;
}

\input, select {
\padding: 10px 5px;
\font-size: 12px;
}

.summary-box strong {
\font-size: 25px;
}
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>GPA CALCULATOR</h1>
<p>Calculate your academic performance</p>
</header>

<div class="summary">
<div class="summary-box">
<span>평균 평점 (GPA)</span>
<strong id="gpa">0.00</strong>
<span>/ 4.5</span>
</div>

<div class="summary-box">
<span>총 이수 학점</span>
<strong id="totalCredits">0</strong>
<span>Credits</span>
</div>
</div>

<h2>과목별 성적 입력</h2>

<div id="courseList" class="course-list"></div>

<button class="add-btn" onclick="addCourse()">
    + 과목 추가
</button>

<div id="message" class="message"></div>

<button class="reset-btn" onclick="resetCalculator()">
\AC · 전체 초기화
</button>

<div class="guide">
<strong>성적 환산 기준 (4.5 만점)</strong><br>
\A+ : 4.5 &nbsp; A0 : 4.0<br>
\B+ : 3.5 &nbsp; B0 : 3.0<br>
\C+ : 2.5 &nbsp; C0 : 2.0<br>
\D+ : 1.5 &nbsp; D0 : 1.0<br>
\F : 0.0
<br><br>
\※ 평균 평점은 과목별 학점에 따른 가중평균으로 계산됩니다.
</div>

</div>

<script>
const gradePoints = {
"A+": 4.5,
"A0": 4.0,
"B+": 3.5,
"B0": 3.0,
"C+": 2.5,
"C0": 2.0,
"D+": 1.5,
"D0": 1.0,
"F": 0.0
};

function addCourse() {
\const list = document.getElementById("courseList");

\const row = document.createElement("div");
\row.className = "course-row";

\row.innerHTML = `
<input type="text" class="course-name"
\placeholder="과목명" aria-label="과목명">

<input type="number" class="credit"
\placeholder="학점" min="0.5" max="30"
\step="0.5" aria-label="이수 학점">

<select class="grade" aria-label="성적">
<option value="">성적</option>
<option value="A+">A+</option>
<option value="A0">A0</option>
<option value="B+">B+</option>
<option value="B0">B0</option>
<option value="C+">C+</option>
<option value="C0">C0</option>
<option value="D+">D+</option>
<option value="D0">D0</option>
<option value="F">F</option>
</select>

<button type="button" class="delete-btn"
\aria-label="과목 삭제">×</button>
`;

\list.appendChild(row);

\row.querySelectorAll("input, select").forEach(element => {
\element.addEventListener("input", calculateGPA);
\element.addEventListener("change", calculateGPA);
});

\row.querySelector(".delete-btn").addEventListener("click", () => {
\row.remove();
\calculateGPA();
});

\calculateGPA();
}

function calculateGPA() {
\const rows = document.querySelectorAll(".course-row");

\let totalCredits = 0;
\let totalPoints = 0;
\let invalid = false;

\rows.forEach(row => {
\const creditInput = row.querySelector(".credit");
\const grade = row.querySelector(".grade").value;
\const creditText = creditInput.value;

\if (creditText === "" && grade === "") return;

\const credit = Number(creditText);

\if (
\creditText === "" ||
!Number.isFinite(credit) ||
\credit <= 0 ||
\credit > 30 ||
!grade
) {
\invalid = true;
\return;
}

\totalCredits += credit;
\totalPoints += credit * gradePoints[grade];
});

\const message = document.getElementById("message");

\if (invalid) {
\message.textContent = "학점은 0보다 크고 30 이하여야 하며, 성적도 선택해야 합니다.";
} else {
\message.textContent = "";
}

\document.getElementById("totalCredits").textContent =
\totalCredits.toFixed(1).replace(/.0$/, "");

\document.getElementById("gpa").textContent =
\totalCredits > 0 && !invalid
? (totalPoints / totalCredits).toFixed(2)
: "0.00";
}

function resetCalculator() {
\if (!confirm("입력한 모든 과목을 초기화할까요?")) return;

\document.getElementById("courseList").innerHTML = "";
\document.getElementById("message").textContent = "";
\document.getElementById("gpa").textContent = "0.00";
\document.getElementById("totalCredits").textContent = "0";

\addCourse();
}

addCourse();
</script>

</body>
</html>
