<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Calculator</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
padding: 35px 15px;
font-family: Arial, "Malgun Gothic", sans-serif;
background: #f1f6fc;
color: #334155;
}

.container {
max-width: 850px;
margin: auto;
padding: 35px;
background: white;
border-radius: 20px;
box-shadow: 0 8px 30px rgba(65,105,160,0.1);
}

header {
text-align: center;
margin-bottom: 30px;
}

header h1 {
color: #527eaf;
font-size: 30px;
margin-bottom: 8px;
}

header p {
color: #94a3b8;
font-size: 14px;
}

.summary {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 15px;
margin-bottom: 30px;
}

.summary-box {
background: #edf5ff;
padding: 22px;
border-radius: 14px;
text-align: center;
}

.summary-box span {
display: block;
font-size: 13px;
color: #7895b7;
margin-bottom: 10px;
}

.summary-box strong {
font-size: 30px;
color: #527eaf;
}

h2 {
font-size: 19px;
color: #527eaf;
margin-bottom: 15px;
}

.course-list {
display: flex;
flex-direction: column;
gap: 10px;
}

.course-row {
display: grid;
grid-template-columns: 2fr 1fr 1fr 45px;
gap: 10px;
}

input, select {
width: 100%;
min-width: 0;
padding: 12px;
border: 1px solid #dbe5f0;
border-radius: 9px;
font-size: 14px;
background: white;
color: #334155;
}

input:focus, select:focus {
outline: none;
border-color: #80a9d5;
}

button {
border: none;
cursor: pointer;
border-radius: 9px;
font-size: 14px;
transition: 0.2s;
}

.delete-btn {
background: #fff0f0;
color: #d66c6c;
font-size: 22px;
}

.delete-btn:hover {
background: #ffe0e0;
}

.add-btn {
width: 100%;
padding: 14px;
margin-top: 15px;
background: #e8f2ff;
color: #527eaf;
font-weight: bold;
}

.add-btn:hover {
background: #d8e9fc;
}

.reset-btn {
width: 100%;
margin-top: 20px;
padding: 15px;
background: #527eaf;
color: white;
font-weight: bold;
}

.reset-btn:hover {
background: #3d6899;
}

.message {
color: #d66c6c;
font-size: 13px;
margin-top: 12px;
min-height: 18px;
}

.guide {
margin-top: 25px;
padding: 18px;
background: #f7faff;
border-radius: 12px;
font-size: 13px;
line-height: 1.9;
color: #718096;
}

@media (max-width: 600px) {
.container {
padding: 22px 15px;
}

.course-row {
grid-template-columns: 1.5fr 0.8fr 0.9fr 35px;
gap: 5px;
}

input, select {
padding: 10px 4px;
font-size: 12px;
}

.summary-box strong {
font-size: 25px;
}
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>GPA CALCULATOR</h1>
<p>Calculate your academic performance</p>
</header>

<div class="summary">

<div class="summary-box">
<span>평균 평점 (GPA)</span>
<strong id="gpa">0.00</strong>
<span>/ 4.5</span>
</div>

<div class="summary-box">
<span>총 이수 학점</span>
<strong id="totalCredits">0</strong>
<span>Credits</span>
</div>

</div>

<h2>과목별 성적 입력</h2>

<div id="courseList" class="course-list"></div>

<button type="button" id="addBtn" class="add-btn">
    + 과목 추가
</button>

<div id="message" class="message"></div>

<button type="button" id="resetBtn" class="reset-btn">
\AC · 전체 초기화
</button>

<div class="guide">
<strong>성적 환산 기준 (4.5 만점)</strong><br>
\A+ : 4.5 &nbsp; A0 : 4.0<br>
\B+ : 3.5 &nbsp; B0 : 3.0<br>
\C+ : 2.5 &nbsp; C0 : 2.0<br>
\D+ : 1.5 &nbsp; D0 : 1.0<br>
\F : 0.0
<br><br>
\※ 평균 평점은 과목별 이수 학점을 반영한
\가중평균으로 계산됩니다.
</div>

</div>

<script>

// 성적별 평점
const gradePoints = {
"A+": 4.5,
"A0": 4.0,
"B+": 3.5,
"B0": 3.0,
"C+": 2.5,
"C0": 2.0,
"D+": 1.5,
"D0": 1.0,
"F": 0.0
};

const courseList = document.getElementById("courseList");
const gpaDisplay = document.getElementById("gpa");
const creditDisplay = document.getElementById("totalCredits");
const message = document.getElementById("message");

// 과목 입력칸 생성
function addCourse() {

const row = document.createElement("div");
row.className = "course-row";

const nameInput = document.createElement("input");
nameInput.type = "text";
nameInput.placeholder = "과목명";
nameInput.className = "course-name";

const creditInput = document.createElement("input");
creditInput.type = "number";
creditInput.placeholder = "학점";
creditInput.min = "0.5";
creditInput.max = "30";
creditInput.step = "0.5";
creditInput.className = "credit";

const gradeSelect = document.createElement("select");
gradeSelect.className = "grade";

const defaultOption = document.createElement("option");
defaultOption.value = "";
defaultOption.textContent = "성적";

gradeSelect.appendChild(defaultOption);

Object.keys(gradePoints).forEach(grade => {
const option = document.createElement("option");
option.value = grade;
option.textContent = grade;
gradeSelect.appendChild(option);
});

const deleteBtn = document.createElement("button");
deleteBtn.type = "button";
deleteBtn.className = "delete-btn";
deleteBtn.textContent = "×";
deleteBtn.setAttribute("aria-label", "과목 삭제");

row.appendChild(nameInput);
row.appendChild(creditInput);
row.appendChild(gradeSelect);
row.appendChild(deleteBtn);

courseList.appendChild(row);

calculateGPA();
}

// GPA 계산
function calculateGPA() {

const rows = document.querySelectorAll(".course-row");

let totalCredits = 0;
let totalPoints = 0;
let invalid = false;

rows.forEach(row => {

const creditValue = row.querySelector(".credit").value;
const grade = row.querySelector(".grade").value;

// 완전히 비어 있는 행은 계산에서 제외
if (creditValue === "" && grade === "") {
return;
}

const credit = Number(creditValue);

// 잘못된 입력 확인
if (
creditValue === "" ||
!Number.isFinite(credit) ||
credit <= 0 ||
credit > 30 ||
grade === ""
) {
invalid = true;
return;
}

totalCredits += credit;
totalPoints += credit * gradePoints[grade];

});

// 총 이수 학점 표시
creditDisplay.textContent =
totalCredits.toFixed(1).replace(/.0$/, "");

// 입력 오류 메시지
if (invalid) {
message.textContent =
"학점과 성적을 올바르게 입력해 주세요.";
gpaDisplay.textContent = "--";
return;
}

message.textContent = "";

// 평균 평점 계산
if (totalCredits > 0) {
const gpa = totalPoints / totalCredits;
gpaDisplay.textContent = gpa.toFixed(2);
} else {
gpaDisplay.textContent = "0.00";
}
}

// 과목 추가 버튼
document.getElementById("addBtn").addEventListener("click", function() {
addCourse();
});

// 입력값이 바뀌면 자동 계산
courseList.addEventListener("input", calculateGPA);
courseList.addEventListener("change", calculateGPA);

// 과목 삭제
courseList.addEventListener("click", function(event) {
if (event.target.classList.contains("delete-btn")) {
event.target.closest(".course-row").remove();
calculateGPA();
}
});

// 전체 초기화
document.getElementById("resetBtn").addEventListener("click", function() {

courseList.innerHTML = "";

gpaDisplay.textContent = "0.00";
creditDisplay.textContent = "0";
message.textContent = "";

addCourse();
});

// 최초 실행 시 입력칸 하나 생성
addCourse();

</script>

</body>
</html>
